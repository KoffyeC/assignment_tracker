<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In · Student Planner</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <form class="card login-card" id="login-form">
        <p class="login-card__brand">Student Planner</p>
        <h1 class="login-card__title">Welcome back</h1>
        <p class="login-card__description">Continue to your assignments, notes, and calendar.</p>
        <p class="status-message" id="login-message" role="status" hidden></p>
        <button class="btn btn--primary login-card__button" type="submit">Continue to Planner</button>
        <p class="login-card__note">This classroom project stores planner data only in this browser.</p>
      </form>
    </main>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
